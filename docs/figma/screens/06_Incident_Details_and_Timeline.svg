        <text x="38" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0B1A33">Status updated to In Progress</text>
        <text x="335" y="122" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#5C6672">2:40 PM</text>
        <text x="38" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#5C6672">Staff Note: Plumbing technician dispatched to Pod B.</text>

        <circle cx="24" cy="170" r="5" fill="#1E5BB8"/>
        <text x="38" y="174" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0B1A33">Report Submitted</text>
        <text x="335" y="174" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#5C6672">2:15 PM</text>
        <text x="38" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#5C6672">Incident logged by Olowoyo Erioluwa Gideon.</text>
