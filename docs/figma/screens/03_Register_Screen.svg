<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -48 473 940" width="473" height="940">
  <rect x="0" y="-48" width="473" height="940" fill="#0F172A"/>
  <g transform="translate(40, 12)">
    
  <g id="03_Register_Screen" transform="translate(0, 0)">
    <text x="0" y="-26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">03. Register Screen (Auto-Role Detection)</text>
           <text x="0" y="-9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8">393 × 852 px · lib/screens/auth/register_screen.dart</text>
    <!-- Outer Device Bezel Shadow & Clip -->
    <rect id="03_Register_Screen_Frame_Background" x="0" y="0" width="393" height="852" rx="36" fill="#F4F6FA" stroke="#334155" stroke-width="2"/>
    
    <!-- Screen Content Group -->
