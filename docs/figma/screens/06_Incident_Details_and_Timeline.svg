        <text x="16" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#0B1A33">Low water pressure on the 2nd floor washrooms</text>
        <text x="16" y="58" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#0B1A33">since morning classes began. Kindly inspect valve.</text>
