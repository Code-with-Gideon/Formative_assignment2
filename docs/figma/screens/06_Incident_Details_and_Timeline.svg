        <circle cx="176.5" cy="92" r="24" fill="#FFFFFF" opacity="0.15"/>
        <text x="176.5" y="98" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">📷</text>
        <text x="176.5" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Verified Incident Photo · Cloud Storage</text>
        <text x="176.5" y="158" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">incidents/1793896023500/photo.png</text>
