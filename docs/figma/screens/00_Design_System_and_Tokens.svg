    <text x="70" y="758" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#5C6672">Mirrors the horizontal red-over-white cut of the ALU</text>
    <text x="70" y="776" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#5C6672">letterforms across section headers and hero cards.</text>

