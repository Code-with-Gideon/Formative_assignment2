      <!-- App Bar -->
      <g id="Register_AppBar" transform="translate(24, 56)">
        <text x="0" y="20" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0B1A33">←   Create Account</text>
      </g>

      <!-- Header with AluMark & SplitBar -->
      <g id="Register_Header" transform="translate(24, 102)">
        
  <g id="AluMark" transform="translate(0, 0) scale(0.75)">
    <rect width="56" height="56" rx="12" fill="#002E6D"/>
    <g fill="#D00D2D">
      <polygon points="9,14 16,14 20,27 13,27"/>
      <rect x="24" y="14" width="7" height="13"/>
      <rect x="36" y="14" width="6.5" height="13"/>
      <rect x="45.5" y="14" width="6.5" height="13"/>
    </g>
    <g fill="#FFFFFF">
      <polygon points="6,29 21,29 24,41 18,41 17,37 10,37 9,41 3,41"/>
      <polygon points="24,29 31,29 31,35 35,35 35,41 24,41"/>
      <path d="M36,29 L42.5,29 L42.5,33.5 C42.5,35.2 43.2,36 44.2,36 C45.2,36 45.8,35.2 45.8,33.5 L45.8,29 L52,29 L52,34 C52,38.8 48.8,41.5 44,41.5 C39.2,41.5 36,38.8 36,34 Z"/>
    </g>
  </g>
        <text x="54" y="20" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0B1A33">Join ALU CampusCare</text>
        <rect x="54" y="28" width="34" height="3" fill="#D00D2D"/>
        <rect x="54" y="31" width="34" height="3" fill="#002E6D"/>
        <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#5C6672">One unified portal. Your account role is automatically</text>
        <text x="0" y="79" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#5C6672">assigned from your institutional ALU email domain.</text>
      </g>

      <!-- Form Fields -->
      <g id="Register_Fields" transform="translate(24, 204)">
        <!-- Full Name -->
        <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0B1A33">Full Name</text>
        <rect x="0" y="8" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E1E6EE"/>
        <text x="16" y="36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#0B1A33">Olowoyo Erioluwa Gideon</text>

        <!-- Institutional Email -->
        <text x="0" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0B1A33">Institutional ALU Email</text>
        <rect x="0" y="82" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#002E6D" stroke-width="1.5"/>
        <text x="16" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#0B1A33">e.olowoyo@alustudent.com</text>

