          <text x="42" y="22" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#002E6D">Student account detected (@alustudent.com)</text>
          <text x="42" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#5C6672">Incident reporting &amp; live tracking dashboard enabled.</text>
        </g>

        <!-- Student ID -->
