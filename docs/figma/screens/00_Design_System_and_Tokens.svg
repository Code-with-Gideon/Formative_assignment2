<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -48 1000 940" width="1000" height="940">
  <rect x="0" y="-48" width="1000" height="940" fill="#0F172A"/>
  <g transform="translate(40, 12)">
    
  <g id="00_ALU_Design_System_Board" transform="translate(0, 0)">
    <text x="0" y="-26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">00. ALU Brand Identity &amp; Design System Tokens</text>
    <text x="0" y="-9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8">920 × 852 px · Pixel-Sampled from Official ALU Wordmark</text>

    <rect width="920" height="852" rx="28" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Navy Banner -->
    <rect x="0" y="0" width="920" height="128" rx="28" fill="#002E6D"/>
    <rect x="0" y="100" width="920" height="28" fill="#002E6D"/>
    <rect x="0" y="123" width="920" height="5" fill="#D00D2D"/>
    
  <g id="ALU_Official_Logo" transform="translate(32, 34) scale(1.1)">
    <rect id="ALU_Navy_Backing" x="0" y="0" width="250" height="56" rx="8" fill="#002E6D"/>
    <!-- Top Red Half of A L U -->
    <g id="ALU_Mark_Red_Top" fill="#D00D2D">
      <!-- A top slanted bar -->
      <polygon points="18,10 29,10 35,27 24,27"/>
      <!-- L top vertical bar -->
      <rect x="44" y="10" width="11" height="17"/>
      <!-- U top two vertical bars -->
      <rect x="68" y="10" width="11" height="17"/>
      <rect x="86" y="10" width="11" height="17"/>
    </g>
