      <!-- Attached Photo Card -->
      <g id="Details_Photo_Evidence" transform="translate(20, 608)">
        <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0B1A33">Attached Photo</text>
