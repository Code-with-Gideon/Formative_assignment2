        <text x="16" y="248" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#0B1A33">ALU-2024-0891</text>

        <!-- Password -->
        <text x="0" y="286" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0B1A33">Password</text>
        <rect x="0" y="294" width="345" height="46" rx="12" fill="#FFFFFF" stroke="#E1E6EE"/>
        <text x="16" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0B1A33">••••••••••</text>

        <!-- Submit CTA -->
        <rect x="0" y="362" width="345" height="50" rx="14" fill="#002E6D"/>
        <text x="172.5" y="392" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Create Account</text>

        <!-- OR + Google -->
        <text x="172.5" y="434" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#5C6672">OR</text>
        <rect x="0" y="448" width="345" height="48" rx="14" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.5"/>
        <circle cx="92" cy="472" r="9" fill="#4285F4"/>
        <text x="92" y="476" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">G</text>
        <text x="184" y="477" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0B1A33">Sign up with Google</text>
      </g>
    
    </g>

    <!-- iOS Status Bar -->
    <g id="03_Register_Screen_StatusBar" transform="translate(0, 0)">
      <text x="32" y="27" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0B1A33">9:41</text>
